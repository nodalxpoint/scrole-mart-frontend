<!-- admin/products/products.component.html -->
<div class="products-page">

  <!-- ══════════════════════════════════════
       DELETE CONFIRM POPUP
  ══════════════════════════════════════ -->
  <div class="mini-overlay" *ngIf="showDeleteConfirm" (click)="cancelDelete()">
    <div class="mini-popup delete-popup" (click)="$event.stopPropagation()">
      <div class="mini-icon-wrap delete-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
          <path d="M10 11v6M14 11v6M9 6V4h6v2"/>
        </svg>
      </div>
      <div class="mini-body">
        <p class="mini-title">Delete product?</p>
        <p class="mini-sub">{{ deleteProductName }}</p>
      </div>
      <div class="mini-actions">
        <button class="mini-btn mini-cancel"  (click)="cancelDelete()">Cancel</button>
        <button class="mini-btn mini-delete"  (click)="confirmDelete()">Delete</button>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════
       SUCCESS / DELETE TOAST
  ══════════════════════════════════════ -->
  <div class="toast-wrap" *ngIf="showToast">
    <div class="toast-popup" [class.toast-delete]="toastType === 'delete'" (click)="closeToast()">
      <div class="toast-icon">
        <!-- Success icon -->
        <svg *ngIf="toastType === 'success'" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="white" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        <!-- Delete icon -->
        <svg *ngIf="toastType === 'delete'" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="white" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
          <path d="M10 11v6M14 11v6M9 6V4h6v2"/>
        </svg>
      </div>
      <div class="toast-text">
        <span class="toast-title">{{ toastTitle }}</span>
        <span class="toast-sub">{{ toastSub }}</span>
      </div>
      <button class="toast-close" (click)="closeToast()">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
      <div class="toast-bar" [class.toast-bar-delete]="toastType === 'delete'"></div>
    </div>
  </div>

  <!-- ── Filters + Search + Add Button ── -->
  <app-product-filters
    [categories]="categories"
    [filters]="filters"
    (filtersChange)="onFiltersChange($event)"
    (onClearAll)="onClearAllFilters()"
    (onAddProduct)="openAddForm()">
  </app-product-filters>

  <!-- ── Global Error ── -->
  <div class="error-alert" *ngIf="error">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="8" x2="12" y2="12"/>
      <line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    {{ error }}
    <button (click)="error = ''">✕</button>
  </div>

  <!-- ── Loading Spinner ── -->
  <div class="loading-wrap" *ngIf="loading">
    <div class="spinner"></div>
    <p>Loading products...</p>
  </div>

  <!-- ── Products Table + Pagination ── -->
  <app-product-table
    *ngIf="!loading"
    [products]="products"
    [totalElements]="totalElements"
    [startIndex]="startIndex"
    [endIndex]="endIndex"
    [currentPage]="currentPage"
    [totalPages]="totalPages"
    [pageSize]="pageSize"
    [pageNumbers]="pageNumbers"
    [sortField]="sortField"
    [sortDir]="sortDir"
    (onView)="openDetails($event)"
    (onEdit)="openEditForm($event)"
    (onDelete)="deleteProduct($event)"
    (onSort)="onSort($event)"
    (onPageChange)="onPageChange($event)"
    (onPageSizeChange)="onPageSizeChange($event)"
    (onClearFilters)="onClearAllFilters()">
  </app-product-table>

  <!-- ── Product Detail Modal ── -->
  <app-product-detail-modal
    [show]="showDetails"
    [product]="selectedProduct"
    (onClose)="showDetails = false"
    (onEdit)="openEditForm($event)">
  </app-product-detail-modal>

  <!-- ── Add / Edit Form Modal ── -->
  <app-product-form-modal
    [show]="showForm"
    [saving]="saving"
    [error]="error"
    [categories]="categories"
    [editingProduct]="editingProduct"
    (onClose)="closeForm()"
    (onSubmit)="onFormSubmit($event)">
  </app-product-form-modal>

</div>
