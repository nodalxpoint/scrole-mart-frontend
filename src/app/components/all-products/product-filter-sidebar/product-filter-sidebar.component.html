<!-- product-filter-sidebar.component.html -->
<aside class="filter-sidebar" [class.open]="isOpen" (click)="$event.stopPropagation()">

  <div class="sidebar-header">
    <div class="sidebar-title-row">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
      </svg>
      <h3 class="sidebar-title">Filters</h3>
    </div>
    <button class="sidebar-close" (click)="closeFilter.emit()" aria-label="Close filters">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <!-- Search -->
  <div class="filter-section">
    <label class="filter-label">Search</label>
    <div class="search-input-wrap">
      <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
      </svg>
      <input
        type="text"
        class="search-input"
        placeholder="Search products..."
        [(ngModel)]="keyword"
        (input)="onSearchInput()" />
      <!-- ✅ sirf clear icon dikhega, clear hone pe parent ko bhi notify -->
      <button class="search-clear" *ngIf="keyword"
        (click)="keyword = ''; clearSearch.emit()">×</button>
    </div>
  </div>

  <!-- Category Filter -->
  <div class="filter-section">
    <label class="filter-label">Category</label>
    <div class="category-list">
      <button class="cat-item" [class.active]="!selectedCategory" (click)="categoryChange.emit('')">
        <span class="cat-dot"></span>
        <span class="cat-name">All Products</span>
        <span class="cat-check" *ngIf="!selectedCategory">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </span>
      </button>
      <button *ngFor="let cat of categories"
        class="cat-item"
        [class.active]="selectedCategory === cat"
        (click)="categoryChange.emit(cat)">
        <span class="cat-dot"></span>
        <span class="cat-name">{{ cat }}</span>
        <span class="cat-check" *ngIf="selectedCategory === cat">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </span>
      </button>
    </div>
  </div>

  <!-- Price Range -->
  <div class="filter-section">
    <label class="filter-label">Price Range</label>
    <div class="price-inputs">
      <div class="price-field">
        <span class="price-symbol">₹</span>
        <input type="number" class="price-input" placeholder="Min"
          [(ngModel)]="minPrice"
          (change)="priceChange.emit({ min: minPrice, max: maxPrice })" />
      </div>
      <div class="price-range-dash">—</div>
      <div class="price-field">
        <span class="price-symbol">₹</span>
        <input type="number" class="price-input" placeholder="Max"
          [(ngModel)]="maxPrice"
          (change)="priceChange.emit({ min: minPrice, max: maxPrice })" />
      </div>
    </div>
  </div>

  <div class="sidebar-divider"></div>

  <button class="clear-filters-btn" (click)="clearAll.emit()" *ngIf="hasActiveFilters">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>
    </svg>
    Clear All Filters
  </button>

</aside>
