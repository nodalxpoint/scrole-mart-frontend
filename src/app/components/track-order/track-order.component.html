<!-- track-order/track-order.component.html -->

<!-- ── HERO ── -->
<section class="track-hero">
  <div class="hero-eyebrow">Track Your Order</div>
  <h1>Where is your <em>kurti</em> right now?</h1>
  <p>Enter your tracking ID to get live shipment status</p>
</section>

<!-- ── SEARCH CARD ── -->
<section class="search-section">
  <div class="search-card">
    <label for="trackInput">Tracking ID</label>

    <div class="search-input-wrap">
      <input
        id="trackInput"
        class="search-input"
        type="text"
        placeholder="e.g. TRK-3A9402DFD0F63"
        [(ngModel)]="trackingKey"
        (keydown.enter)="onTrack()"
        autocomplete="off"
      />
      <button class="search-btn" (click)="onTrack()" [disabled]="loading">
        <svg *ngIf="!loading" width="14" height="14" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <span class="btn-spinner" *ngIf="loading"></span>
        {{ loading ? 'Tracking…' : 'Track' }}
      </button>
    </div>

    <!-- Error inline -->
    <p class="input-error" *ngIf="error">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      {{ error }}
    </p>
  </div>
</section>

<!-- ── RESULT CHILD COMPONENT ── -->
<app-track-order-result
  *ngIf="orderData"
  [trackingKey]="lastTracked"
  [orderData]="orderData"
></app-track-order-result>
