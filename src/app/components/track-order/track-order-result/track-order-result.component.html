<!-- track-order/track-order-result/track-order-result.component.html -->

<section class="result-wrap">

  <!-- ── ORDER HEADER CARD ── -->
  <div class="order-header-card">
    <div class="order-meta">
      <h2>{{ orderData.name }}</h2>
      <div class="order-id-tag">
        Tracking ID: <strong>{{ trackingKey }}</strong>
      </div>
      <div class="customer-chips">
        <span class="chip">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          {{ orderData.email }}
        </span>
      </div>
    </div>

    <!-- Status badge -->
    <span class="status-badge" [ngClass]="statusClass">
      <span class="status-dot"></span>
      {{ statusLabel }}
    </span>
  </div>

  <!-- ── TIMELINE CARD ── -->
  <div class="timeline-card">
    <h3>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>
      Shipment Progress
    </h3>

    <div class="timeline">
      <div
        class="timeline-step"
        *ngFor="let step of timelineSteps"
        [ngClass]="{ done: step.done, active: step.active }"
      >
        <div class="step-dot">
          <!-- Checkmark for done -->
          <svg *ngIf="step.done && !step.active" width="14" height="14" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          <!-- Pulsing circle for active -->
          <svg *ngIf="step.active" width="14" height="14" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5" fill="currentColor"/>
          </svg>
          <!-- Empty for pending -->
          <svg *ngIf="!step.done && !step.active" width="14" height="14" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
          </svg>
        </div>

        <div class="step-body">
          <span class="step-label">{{ step.label }}</span>
          <span class="step-desc">{{ step.desc }}</span>
        </div>
      </div>
    </div>
  </div>

</section>
